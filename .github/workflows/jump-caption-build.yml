name: Caption + Assemble Jump With Me
on:
  push:
    branches: ["claude/sunny-crew-ep1-assembly-8hg5om"]
    paths: ["_staging/jump/caption.trigger"]
permissions:
  contents: write
jobs:
  caption-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install faster-whisper
        run: pip install --quiet faster-whisper
      - name: Transcribe audio (real sung lyrics + timestamps)
        run: python3 scripts/transcribe.py _staging/audio/jump-with-me.mp3 _staging/jump/transcript.json small
      - name: Build caption lines from transcript
        run: python3 scripts/song_captions.py _staging/jump/transcript.json _staging/jump/captions.json 40 8
      - name: Assemble with audio-synced captions
        run: python3 scripts/jump_build.py
      - name: Commit result
        run: |
          git config user.name "jump-build-bot"
          git config user.email "actions@github.com"
          git add _staging/jump/transcript.json _staging/jump/captions.json sunny-and-the-crew/song-shorts/Jump-With-Me.mp4
          git commit -m "Jump With Me: audio-synced captions from transcript (auto)"
          git push
