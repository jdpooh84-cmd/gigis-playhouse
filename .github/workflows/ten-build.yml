name: Assemble Ten Little Fingers lullaby
on:
  push:
    branches: ["claude/sunny-crew-ep1-assembly-8hg5om"]
    paths: ["_staging/ten/build.trigger"]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Assemble Ten Little Fingers
        run: python3 scripts/ten_build.py
      - name: Commit result
        run: |
          git config user.name "ten-build-bot"
          git config user.email "actions@github.com"
          git add sunny-and-the-crew/song-shorts/Ten-Little-Fingers-Folding-Down.mp4
          git commit -m "Ten Little Fingers: build lullaby short (auto)"
          git push
