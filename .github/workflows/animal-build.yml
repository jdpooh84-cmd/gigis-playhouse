name: Assemble Move Like the Animal song short
on:
  push:
    branches: ["claude/sunny-crew-ep1-assembly-8hg5om"]
    paths: ["_staging/animal/build.trigger"]

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Assemble Move Like the Animal
        run: python3 scripts/animal_build.py
      - name: Commit result
        run: |
          git config user.name "animal-build-bot"
          git config user.email "actions@github.com"
          git add sunny-and-the-crew/song-shorts/Move-Like-the-Animal.mp4
          git commit -m "Move Like the Animal: build song short (auto)"
          git push
