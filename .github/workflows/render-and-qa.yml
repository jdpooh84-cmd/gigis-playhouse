name: Render and QA — Remotion Animation

on:
  push:
    branches:
      - claude/preschool-cartoon-video-y50npq
    paths:
      - preschool-animation/timeline.json
      - preschool-animation/src/**
      - preschool-animation/scripts/**
      - .github/workflows/render-and-qa.yml

permissions:
  contents: write

env:
  NODE_VERSION: "20"

jobs:
  render-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/preschool-cartoon-video-y50npq
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: preschool-animation/package-lock.json

      - name: Install dependencies
        working-directory: preschool-animation
        run: npm ci --prefer-offline || npm install

      - name: Install system deps (ffmpeg + ImageMagick)
        run: sudo apt-get install -y ffmpeg imagemagick

      - name: Prepare assets
        working-directory: preschool-animation
        run: node scripts/download-assets.js

      - name: Render draft
        id: render
        working-directory: preschool-animation
        run: |
          mkdir -p out
          npx remotion render ZoomyZoomFreeze out/draft.mp4 --overwrite
          ls -lh out/draft.mp4

      # Freeze pixel-diff verification — exits 1 on any failure
      - name: Verify freeze frames (pixel-diff)
        id: freeze-verify
        working-directory: preschool-animation
        run: node scripts/verify-freeze-frames.js out/draft.mp4

      # Upload video so qa-submit.js can pass a URL instead of base64
      - name: Upload draft video for QA URL access
        id: upload-draft
        uses: actions/upload-artifact@v4
        with:
          name: draft-for-qa
          path: preschool-animation/out/draft.mp4
          retention-days: 1

      # Apify LLM video QA — exits 2 on QA fail, exits 1 on error
      - name: Submit to Apify video QA
        id: apify-qa
        working-directory: preschool-animation
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_QA_ACTOR_ID: ${{ secrets.APIFY_QA_ACTOR_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Pass the video URL if available from a public artifact URL,
          # otherwise fall back to the local file (will upload to Apify KV store)
          node scripts/qa-submit.js --file out/draft.mp4

      # Release gate — reads both freeze-verify-results.json and qa-result.json
      # and produces qa_report.json + release_gate_report.md
      # This step is the AUTHORITATIVE pass/fail for the release decision
      - name: Release gate
        id: release-gate
        working-directory: preschool-animation
        run: node scripts/release-gate.js

      # --- Artifacts (always uploaded so failures are diagnosable) ---

      - name: Upload qa_report.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report-json
          path: preschool-animation/qa_report.json
          retention-days: 30

      - name: Upload release_gate_report.md
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-report
          path: preschool-animation/release_gate_report.md
          retention-days: 30

      - name: Upload freeze-verify-results.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freeze-verify-results
          path: preschool-animation/freeze-verify-results.json
          retention-days: 30

      - name: Upload qa-result.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apify-qa-result
          path: preschool-animation/qa-result.json
          retention-days: 30

      - name: Upload rendered draft
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draft-mp4
          path: preschool-animation/out/draft.mp4
          retention-days: 7

      # --- Release: ONLY if the release gate step explicitly passed ---
      # `steps.release-gate.outcome == 'success'` requires release-gate.js
      # to exit 0. A skipped or failed release-gate step will block this.

      - name: Publish FINAL as GitHub Release
        if: steps.release-gate.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="remotion-animation-v$(date +%Y%m%dT%H%M%S)"
          cp preschool-animation/out/draft.mp4 \
             "preschool-animation/out/FINAL_Zoomy_Zoom_Freeze_Animation.mp4"
          gh release create "$TAG" \
            --repo jdpooh84-cmd/gigis-playhouse \
            --title "Zoomy Zoom Freeze — Remotion Animation (QA Passed)" \
            --notes "$(cat preschool-animation/release_gate_report.md)" \
            "preschool-animation/out/FINAL_Zoomy_Zoom_Freeze_Animation.mp4" \
            "preschool-animation/qa_report.json"
