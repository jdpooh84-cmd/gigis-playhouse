name: Assemble ZOOMY ZOOM FREEZE Video
on:
  push:
    branches:
      - claude/preschool-cartoon-video-y50npq
    paths:
      - .github/workflows/.video-assembly-trigger

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: claude/preschool-cartoon-video-y50npq
          fetch-depth: 1

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Download Leo+Zoe clips from Higgsfield CDN
        run: |
          mkdir -p preschool-video/video/episode1
          cd preschool-video/video/episode1

          curl -fL -o VID-01.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3ES9J8pFiT5OVr3w5DFkXtrRHEr/hf_20260701_092542_d3e9a9b0-e7c1-4e2a-8dc6-ffd4ee9507a3.mp4"
          curl -fL -o VID-02.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3ES9J8pFiT5OVr3w5DFkXtrRHEr/hf_20260701_092543_c853e75d-f3c2-4ab1-b2a3-613067a4289f.mp4"
          curl -fL -o VID-03.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3ES9J8pFiT5OVr3w5DFkXtrRHEr/hf_20260701_092545_71155554-1a61-4b9d-ab25-9466372c0520.mp4"
          curl -fL -o VID-04.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3ES9J8pFiT5OVr3w5DFkXtrRHEr/hf_20260701_135704_85644a8e-6106-4702-a495-63fd3d347921.mp4"
          curl -fL -o VID-05.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3ES9J8pFiT5OVr3w5DFkXtrRHEr/hf_20260701_092550_d77a4c6b-68af-4427-b433-118ec194158e.mp4"
          curl -fL -o VID-06.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3ES9J8pFiT5OVr3w5DFkXtrRHEr/hf_20260701_092551_8b4f037f-b791-4397-974a-775b08efbfa6.mp4"
          curl -fL -o VID-07.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3ES9J8pFiT5OVr3w5DFkXtrRHEr/hf_20260701_092943_33ab0824-911b-437a-9f56-407ef8b50096.mp4"
          curl -fL -o VID-08.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3ES9J8pFiT5OVr3w5DFkXtrRHEr/hf_20260701_135705_9f2f1360-82ca-459c-aed4-dc72e33a98a1.mp4"
          curl -fL -o VID-09.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3ES9J8pFiT5OVr3w5DFkXtrRHEr/hf_20260701_135708_30d93b7d-56a5-4ccd-98ca-b58ae9677acd.mp4"
          curl -fL -o VID-10.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3ES9J8pFiT5OVr3w5DFkXtrRHEr/hf_20260701_092949_5e064ed8-94c1-4c94-a6c3-ae81b2c972ff.mp4"
          curl -fL -o VID-11.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3ES9J8pFiT5OVr3w5DFkXtrRHEr/hf_20260701_093051_eafdaeb0-d720-477b-82a8-79689ebb2aa1.mp4"
          curl -fL -o VID-12.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3ES9J8pFiT5OVr3w5DFkXtrRHEr/hf_20260701_103909_39233460-7d56-4d5e-affc-e877adfdb0f6.mp4"

          echo '=== Downloaded clips ==='
          ls -lh VID-*.mp4

      - name: Verify clips present
        run: |
          cd preschool-video/video/episode1
          echo '=== Clip inventory ==='
          ls -lh VID-*.mp4
          for i in 01 02 03 04 05 06 07 08 09 10 11 12; do
            [ -s "VID-$i.mp4" ] || { echo "MISSING: VID-$i.mp4"; exit 1; }
          done
          echo 'All 12 clips verified.'

      - name: Assemble final video at 1920x1080
        run: |
          VIDEO_DIR="$GITHUB_WORKSPACE/preschool-video/video/episode1"
          AUDIO="$GITHUB_WORKSPACE/preschool-video/audio/episode1/Zoomy_Zoom_Freeze.mp3"
          OUTPUT="$GITHUB_WORKSPACE/preschool-video/FINAL_VIDEO_ZoomyZoomFreeze.mp4"
          CONCAT="$VIDEO_DIR/concat.txt"

          rm -f "$CONCAT"
          for i in 01 02 03 04 05 06 07 08 09 10 11 12; do
            echo "file '$VIDEO_DIR/VID-$i.mp4'" >> "$CONCAT"
          done

          ffmpeg -y \
            -stream_loop -1 -f concat -safe 0 -i "$CONCAT" \
            -i "$AUDIO" \
            -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2,fade=t=in:st=0:d=1,fade=t=out:st=158:d=1" \
            -af "afade=t=in:st=0:d=1,afade=t=out:st=158:d=1" \
            -c:v libx264 -preset medium -crf 22 \
            -c:a aac -b:a 192k -ar 48000 \
            -pix_fmt yuv420p \
            -map 0:v -map 1:a \
            -shortest \
            "$OUTPUT"

          echo '=== Quality Check ==='
          ffmpeg -i "$OUTPUT" 2>&1 | grep -E 'Duration|Video:|Audio:' || true
          echo "File size: $(du -sh $OUTPUT)"

      - name: Commit and push
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add preschool-video/FINAL_VIDEO_ZoomyZoomFreeze.mp4
          git commit -m "ZOOMY ZOOM FREEZE — Leo+Zoe human characters 1920x1080 reassembly"
          git push origin claude/preschool-cartoon-video-y50npq
