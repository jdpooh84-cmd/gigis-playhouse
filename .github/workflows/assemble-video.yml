name: Assemble ZOOMY ZOOM FREEZE Video
on:
  push:
    branches:
      - claude/preschool-cartoon-video-y50npq
    paths:
      - .github/workflows/.video-assembly-trigger

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: claude/preschool-cartoon-video-y50npq
          fetch-depth: 1

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Download Leo+Zoe clips from Higgsfield CDN
        run: |
          mkdir -p preschool-video/video/episode1
          cd preschool-video/video/episode1

          curl -fL -o VID-01.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3ES9J8pFiT5OVr3w5DFkXtrRHEr/hf_20260701_141716_50ddc7f3-a425-4fa8-bf39-cb5833b31fbf.mp4"
          curl -fL -o VID-02.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3ES9J8pFiT5OVr3w5DFkXtrRHEr/hf_20260701_142109_fc4426f6-f34f-4c7e-89db-9557011f7d68.mp4"
          curl -fL -o VID-03.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3ES9J8pFiT5OVr3w5DFkXtrRHEr/hf_20260701_141720_831664cb-3289-4d88-8718-c4bc078103bc.mp4"
          curl -fL -o VID-04.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3ES9J8pFiT5OVr3w5DFkXtrRHEr/hf_20260701_141723_f03f1ba5-f69e-42c1-b2ba-5bb436cce90f.mp4"
          curl -fL -o VID-05.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3ES9J8pFiT5OVr3w5DFkXtrRHEr/hf_20260701_141725_dafb2f3e-8718-485c-803c-2f9dcb1d4367.mp4"
          curl -fL -o VID-06.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3ES9J8pFiT5OVr3w5DFkXtrRHEr/hf_20260701_142153_754a7b3b-439c-4a16-918b-085a88bde0e2.mp4"
          curl -fL -o VID-07.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3ES9J8pFiT5OVr3w5DFkXtrRHEr/hf_20260701_141731_ea9a2d6f-dd1a-419e-a78d-e0f5376f8279.mp4"
          curl -fL -o VID-08.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3ES9J8pFiT5OVr3w5DFkXtrRHEr/hf_20260701_141733_0ccfe7e1-ac26-45e8-b3c5-51465b06cbba.mp4"
          curl -fL -o VID-09.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3ES9J8pFiT5OVr3w5DFkXtrRHEr/hf_20260701_141735_d84b4159-7cbc-4482-9eef-0647f3e145cd.mp4"
          curl -fL -o VID-10.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3ES9J8pFiT5OVr3w5DFkXtrRHEr/hf_20260701_142113_d59a0659-d19a-4dcd-8011-0db34260a611.mp4"
          curl -fL -o VID-11.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3ES9J8pFiT5OVr3w5DFkXtrRHEr/hf_20260701_142115_86d9e26d-8555-44d0-b243-a15b5332d288.mp4"
          curl -fL -o VID-12.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3ES9J8pFiT5OVr3w5DFkXtrRHEr/hf_20260701_142157_e974e0ac-cc0b-41ec-ad84-af3ac147e876.mp4"

          echo '=== Downloaded clips ==='
          ls -lh VID-*.mp4

      - name: Verify clips present
        run: |
          cd preschool-video/video/episode1
          for i in 01 02 03 04 05 06 07 08 09 10 11 12; do
            [ -s "VID-$i.mp4" ] || { echo "MISSING: VID-$i.mp4"; exit 1; }
          done
          echo 'All 12 clips verified.'

      - name: Strip clip audio and assemble final video at 1920x1080
        run: |
          VIDEO_DIR="$GITHUB_WORKSPACE/preschool-video/video/episode1"
          AUDIO="$GITHUB_WORKSPACE/preschool-video/audio/episode1/Zoomy_Zoom_Freeze.mp3"
          OUTPUT="$GITHUB_WORKSPACE/preschool-video/FINAL_VIDEO_ZoomyZoomFreeze.mp4"
          STRIPPED_DIR="$VIDEO_DIR/stripped"
          CONCAT="$VIDEO_DIR/concat.txt"

          mkdir -p "$STRIPPED_DIR"
          rm -f "$CONCAT"

          for i in 01 02 03 04 05 06 07 08 09 10 11 12; do
            ffmpeg -y -i "$VIDEO_DIR/VID-$i.mp4" -an -c:v copy "$STRIPPED_DIR/VID-$i.mp4"
            echo "file '$STRIPPED_DIR/VID-$i.mp4'" >> "$CONCAT"
          done

          ffmpeg -y \
            -stream_loop -1 -f concat -safe 0 -i "$CONCAT" \
            -i "$AUDIO" \
            -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2,fade=t=in:st=0:d=1,fade=t=out:st=158:d=1" \
            -af "afade=t=in:st=0:d=1,afade=t=out:st=158:d=1" \
            -c:v libx264 -preset medium -crf 22 \
            -c:a aac -b:a 192k -ar 48000 \
            -pix_fmt yuv420p \
            -map 0:v -map 1:a \
            -shortest \
            "$OUTPUT"

          echo '=== Quality Check ==='
          ffmpeg -i "$OUTPUT" 2>&1 | grep -E 'Duration|Video:|Audio:' || true
          echo "File size: $(du -sh $OUTPUT)"

      - name: Publish as GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUTPUT="$GITHUB_WORKSPACE/preschool-video/FINAL_VIDEO_ZoomyZoomFreeze.mp4"
          TAG="zoomy-zoom-freeze-ep1"

          # Delete prior release with same tag if it exists
          gh release delete "$TAG" --repo jdpooh84-cmd/gigis-playhouse --yes 2>/dev/null || true
          git push origin --delete "refs/tags/$TAG" 2>/dev/null || true

          gh release create "$TAG" \
            --repo jdpooh84-cmd/gigis-playhouse \
            --title "ZOOMY ZOOM FREEZE — Episode 1 (Preschool Dance Song)" \
            --notes "Leo+Zoe lip+action sync | Suno audio only | 1920×1080 H.264/AAC | 2:40" \
            "$OUTPUT"

          echo ""
          echo "=== DIRECT DOWNLOAD LINK ==="
          echo "https://github.com/jdpooh84-cmd/gigis-playhouse/releases/download/$TAG/FINAL_VIDEO_ZoomyZoomFreeze.mp4"
