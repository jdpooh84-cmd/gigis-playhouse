name: Assemble ZOOMY ZOOM FREEZE Video
on:
  push:
    branches:
      - claude/preschool-cartoon-video-y50npq
    paths:
      - .github/workflows/.video-assembly-trigger

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: claude/preschool-cartoon-video-y50npq
          fetch-depth: 1

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Download Leo+Zoe clips from Higgsfield CDN
        run: |
          mkdir -p preschool-video/video/episode1
          cd preschool-video/video/episode1

          curl -fL -o VID-01.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3ES9J8pFiT5OVr3w5DFkXtrRHEr/hf_20260701_145826_b41205c5-bfae-40a2-87db-411a4594d060.mp4"
          curl -fL -o VID-02.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3ES9J8pFiT5OVr3w5DFkXtrRHEr/hf_20260701_145829_7703dbac-a384-4d7b-a939-7577bf75f903.mp4"
          curl -fL -o VID-03.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3ES9J8pFiT5OVr3w5DFkXtrRHEr/hf_20260701_150308_18b3d6d1-8cda-4740-8771-973101600132.mp4"
          curl -fL -o VID-04.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3ES9J8pFiT5OVr3w5DFkXtrRHEr/hf_20260701_145834_8eb6d581-0cfb-4e7b-82f1-080293d7f75e.mp4"
          curl -fL -o VID-05.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3ES9J8pFiT5OVr3w5DFkXtrRHEr/hf_20260701_145837_b058a320-bfac-41dc-9f06-e2826d31be9e.mp4"
          curl -fL -o VID-06.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3ES9J8pFiT5OVr3w5DFkXtrRHEr/hf_20260701_145839_69c8611f-8ea5-45b3-949b-e9685b71b6aa.mp4"
          curl -fL -o VID-07.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3ES9J8pFiT5OVr3w5DFkXtrRHEr/hf_20260701_150643_a8f135ed-35e0-4b22-83ff-0f35f901c88c.mp4"
          curl -fL -o VID-08.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3ES9J8pFiT5OVr3w5DFkXtrRHEr/hf_20260701_145845_05878720-bc5f-4fa3-b829-c3c0e89bb95f.mp4"
          curl -fL -o VID-09.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3ES9J8pFiT5OVr3w5DFkXtrRHEr/hf_20260701_145848_cafaba72-9b75-4ff0-b381-aef76123ff47.mp4"
          curl -fL -o VID-10.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3ES9J8pFiT5OVr3w5DFkXtrRHEr/hf_20260701_150311_f2c59bc4-69c8-43b9-9d43-5b5de54312a5.mp4"
          curl -fL -o VID-11.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3ES9J8pFiT5OVr3w5DFkXtrRHEr/hf_20260701_150313_88f9ac96-1621-4dcc-b26d-4a3048190727.mp4"
          curl -fL -o VID-12.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3ES9J8pFiT5OVr3w5DFkXtrRHEr/hf_20260701_150316_bdaaaa12-b831-43bb-992d-fafc2ccd8f59.mp4"

          echo '=== Downloaded clips ==='
          ls -lh VID-*.mp4

      - name: Verify clips present
        run: |
          cd preschool-video/video/episode1
          for i in 01 02 03 04 05 06 07 08 09 10 11 12; do
            [ -s "VID-$i.mp4" ] || { echo "MISSING: VID-$i.mp4"; exit 1; }
          done
          echo 'All 12 clips verified.'

      - name: Strip clip audio and assemble final video at 1920x1080
        run: |
          VIDEO_DIR="$GITHUB_WORKSPACE/preschool-video/video/episode1"
          AUDIO="$GITHUB_WORKSPACE/preschool-video/audio/episode1/Zoomy_Zoom_Freeze.mp3"
          OUTPUT="$GITHUB_WORKSPACE/preschool-video/Zoomy_Zoom_Freeze_Episode1_FINAL.mp4"
          STRIPPED_DIR="$VIDEO_DIR/stripped"
          CONCAT="$VIDEO_DIR/concat.txt"

          mkdir -p "$STRIPPED_DIR"
          rm -f "$CONCAT"

          for i in 01 02 03 04 05 06 07 08 09 10 11 12; do
            ffmpeg -y -i "$VIDEO_DIR/VID-$i.mp4" -an -c:v copy "$STRIPPED_DIR/VID-$i.mp4"
            echo "file '$STRIPPED_DIR/VID-$i.mp4'" >> "$CONCAT"
          done

          ffmpeg -y \
            -stream_loop -1 -f concat -safe 0 -i "$CONCAT" \
            -i "$AUDIO" \
            -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2,fade=t=in:st=0:d=1,fade=t=out:st=158:d=1" \
            -af "afade=t=in:st=0:d=1,afade=t=out:st=158:d=1" \
            -c:v libx264 -preset medium -crf 22 \
            -c:a aac -b:a 192k -ar 48000 \
            -pix_fmt yuv420p \
            -map 0:v -map 1:a \
            -shortest \
            "$OUTPUT"

          echo '=== Quality Check ==='
          ffmpeg -i "$OUTPUT" 2>&1 | grep -E 'Duration|Video:|Audio:' || true
          echo "File size: $(du -sh $OUTPUT)"

      - name: Publish as GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUTPUT="$GITHUB_WORKSPACE/preschool-video/Zoomy_Zoom_Freeze_Episode1_FINAL.mp4"
          TAG="zoomy-zoom-freeze-ep1-v2"

          # Delete prior release with same tag if it exists
          gh release delete "$TAG" --repo jdpooh84-cmd/gigis-playhouse --yes 2>/dev/null || true
          git push origin --delete "refs/tags/$TAG" 2>/dev/null || true

          gh release create "$TAG" \
            --repo jdpooh84-cmd/gigis-playhouse \
            --title "ZOOMY ZOOM FREEZE — Episode 1 v2 (Preschool Dance Song)" \
            --notes "Leo+Zoe lip+action sync v2 | Suno audio only | 1920×1080 H.264/AAC | CRF 22" \
            "$OUTPUT"

          echo ""
          echo "=== DIRECT DOWNLOAD LINK ==="
          echo "https://github.com/jdpooh84-cmd/gigis-playhouse/releases/download/$TAG/Zoomy_Zoom_Freeze_Episode1_FINAL.mp4"
