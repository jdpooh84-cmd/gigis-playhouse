name: Song Timing Pipeline
on:
  workflow_dispatch:
    inputs:
      song:
        description: "song dir under _staging/ (e.g. animalyoga)"
        required: true
        type: string
      phase:
        description: "transcribe | build"
        required: true
        default: build
        type: string
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/sunny-crew-ep1-assembly-8hg5om
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Transcribe
        if: ${{ inputs.phase == 'transcribe' }}
        run: |
          pip install --quiet faster-whisper
          AUDIO=$(python3 -c "import json;print(json.load(open('_staging/${{ inputs.song }}/shot_spec.json'))['audio'])")
          echo "audio: $AUDIO"
          python3 scripts/transcribe.py "$AUDIO" "_staging/${{ inputs.song }}/transcript.json" small
      - name: Build
        if: ${{ inputs.phase == 'build' }}
        run: python3 scripts/song_build.py "${{ inputs.song }}"
      - name: Commit
        run: |
          git config user.name "song-pipeline-bot"
          git config user.email "actions@github.com"
          git add -A _staging/${{ inputs.song }} sunny-and-the-crew/song-shorts || true
          git commit -m "song-pipeline ${{ inputs.phase }}: ${{ inputs.song }} (auto)" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4; do git push origin HEAD:claude/sunny-crew-ep1-assembly-8hg5om && break || sleep $((2**i)); done
