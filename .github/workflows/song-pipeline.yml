name: Song Timing Pipeline
on:
  push:
    branches: ["claude/sunny-crew-ep1-assembly-8hg5om"]
    paths: ["_staging/pipeline.trigger"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Parse trigger
        id: p
        run: |
          SONG=$(sed -n '1p' _staging/pipeline.trigger | tr -d '[:space:]')
          PHASE=$(sed -n '2p' _staging/pipeline.trigger | tr -d '[:space:]')
          echo "song=$SONG"   >> "$GITHUB_OUTPUT"
          echo "phase=$PHASE"  >> "$GITHUB_OUTPUT"
          echo "song=$SONG phase=$PHASE"
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Transcribe
        if: ${{ steps.p.outputs.phase == 'transcribe' }}
        run: |
          pip install --quiet faster-whisper
          AUDIO=$(python3 -c "import json;print(json.load(open('_staging/${{ steps.p.outputs.song }}/shot_spec.json'))['audio'])")
          echo "audio: $AUDIO"
          python3 scripts/transcribe.py "$AUDIO" "_staging/${{ steps.p.outputs.song }}/transcript.json" small
      - name: Build
        if: ${{ steps.p.outputs.phase == 'build' }}
        run: python3 scripts/song_build.py "${{ steps.p.outputs.song }}"
      - name: Commit
        run: |
          git config user.name "song-pipeline-bot"
          git config user.email "actions@github.com"
          git add -A _staging/${{ steps.p.outputs.song }} sunny-and-the-crew/song-shorts || true
          git commit -m "song-pipeline ${{ steps.p.outputs.phase }}: ${{ steps.p.outputs.song }} (auto)" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4; do git push origin HEAD:claude/sunny-crew-ep1-assembly-8hg5om && break || sleep $((2**i)); done
