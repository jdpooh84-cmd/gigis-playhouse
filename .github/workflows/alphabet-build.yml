name: Assemble Alphabet Adventure Train
on:
  push:
    branches: ["claude/sunny-crew-ep1-assembly-8hg5om"]
    paths: ["_staging/alphabet/build.trigger"]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Assemble Alphabet Adventure Train
        run: python3 scripts/alphabet_build.py
      - name: Commit result
        run: |
          git config user.name "alphabet-build-bot"
          git config user.email "actions@github.com"
          git add sunny-and-the-crew/song-shorts/Alphabet-Adventure-Train.mp4
          git commit -m "Alphabet Adventure Train: build song short (auto)"
          git push
