name: Assemble Wiggle Wake Up song short
on:
  push:
    branches: ["claude/sunny-crew-ep1-assembly-8hg5om"]
    paths: ["_staging/wiggle/build.trigger"]

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Assemble Wiggle Wake Up
        run: python3 scripts/wiggle_build.py
      - name: Commit result
        run: |
          git config user.name "wiggle-build-bot"
          git config user.email "actions@github.com"
          git add sunny-and-the-crew/song-shorts/Wiggle-Wake-Up.mp4
          git commit -m "Wiggle Wake Up: build song short (auto)"
          git push
