name: Fetch character check images
on:
  push:
    branches: ["claude/sunny-crew-ep1-assembly-8hg5om"]
    paths: [".github/char-images-trigger"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download candidate character images
        run: |
          mkdir -p _staging/character_check
          rm -f _staging/character_check/*
          set +e
          dl() { curl -sL -A "Mozilla/5.0" -o "_staging/character_check/$2" "$1" && echo "OK $2 $(wc -c < _staging/character_check/$2)" || echo "FAIL $2"; }
          dl "https://d8j0ntlcm91z4.cloudfront.net/user_3ES9J8pFiT5OVr3w5DFkXtrRHEr/hf_20260712_213048_c877ea0a-4fdf-49ea-b774-763d4021359a.png" "spot-s8c06-rena.png"
          dl "https://d8j0ntlcm91z4.cloudfront.net/user_3ES9J8pFiT5OVr3w5DFkXtrRHEr/hf_20260712_213053_49e6daf9-7f2c-4c76-bfc1-0b5f4775eda8.png" "spot-s8c07-rico.png"
          # drop any zero-byte failures
          find _staging/character_check -size -1k -delete
          ls -la _staging/character_check
      - name: Commit
        run: |
          git config user.name "char-check-bot"
          git config user.email "actions@github.com"
          git add -A _staging/character_check
          git commit -m "stage: theme v1.1 replacement images for brand-safety check" || echo "nothing to commit"
          git push
