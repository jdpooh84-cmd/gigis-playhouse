name: Assemble Lights With Mia
on:
  push:
    branches: ["claude/sunny-crew-ep1-assembly-8hg5om"]
    paths: ["_staging/lights/build.trigger"]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Assemble Lights With Mia
        run: python3 scripts/lights_build.py
      - name: Commit result
        run: |
          git config user.name "lights-build-bot"
          git config user.email "actions@github.com"
          git add sunny-and-the-crew/song-shorts/Lights-With-Mia.mp4
          git commit -m "Lights With Mia: build song short (auto)"
          git push
