name: Assemble Leos Two Worlds
on:
  push:
    branches: ["claude/sunny-crew-ep1-assembly-8hg5om"]
    paths: ["_staging/leotwo/build.trigger"]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Assemble Leos Two Worlds
        run: python3 scripts/leotwo_build.py
      - name: Commit result
        run: |
          git config user.name "leotwo-build-bot"
          git config user.email "actions@github.com"
          git add sunny-and-the-crew/song-shorts/Leos-Two-Worlds.mp4
          git commit -m "Leo's Two Worlds: build song short (auto)"
          git push
