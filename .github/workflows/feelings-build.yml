name: Assemble How Do You Feel
on:
  push:
    branches: ["claude/sunny-crew-ep1-assembly-8hg5om"]
    paths: ["_staging/feelings/build.trigger"]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Assemble How Do You Feel
        run: python3 scripts/feelings_build.py
      - name: Commit result
        run: |
          git config user.name "feelings-build-bot"
          git config user.email "actions@github.com"
          git add sunny-and-the-crew/song-shorts/How-Do-You-Feel.mp4
          git commit -m "How Do You Feel?: build song short (auto)"
          git push
