name: Assemble The Potty Dance
on:
  push:
    branches: ["claude/sunny-crew-ep1-assembly-8hg5om"]
    paths: ["_staging/potty/build.trigger"]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Assemble The Potty Dance
        run: python3 scripts/potty_build.py
      - name: Commit result
        run: |
          git config user.name "potty-build-bot"
          git config user.email "actions@github.com"
          git add sunny-and-the-crew/song-shorts/The-Potty-Dance.mp4
          git commit -m "The Potty Dance: build song short (auto)"
          git push
