name: Assemble Jump With Me
on:
  push:
    branches: ["claude/sunny-crew-ep1-assembly-8hg5om"]
    paths: ["_staging/jump/build.trigger"]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Assemble Jump With Me
        run: python3 scripts/jump_build.py
      - name: Commit result
        run: |
          git config user.name "jump-build-bot"
          git config user.email "actions@github.com"
          git add sunny-and-the-crew/song-shorts/Jump-With-Me.mp4
          git commit -m "Jump With Me: build song short (auto)"
          git push
