name: Assemble Animal Yoga
on:
  push:
    branches: ["claude/sunny-crew-ep1-assembly-8hg5om"]
    paths: ["_staging/animalyoga/build.trigger"]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Assemble Animal Yoga
        run: python3 scripts/animalyoga_build.py
      - name: Commit result
        run: |
          git config user.name "animalyoga-build-bot"
          git config user.email "actions@github.com"
          git add sunny-and-the-crew/song-shorts/Animal-Yoga.mp4
          git commit -m "Animal Yoga: build song short (auto)"
          git push
