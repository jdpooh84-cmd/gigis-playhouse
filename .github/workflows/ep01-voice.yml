name: Regenerate EP01 VO (ElevenLabs) + apply
on:
  push:
    branches: ["claude/sunny-crew-ep1-assembly-8hg5om"]
    paths:
      - "_staging/ep01_voice.trigger"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg (static build, no apt)
        run: |
          set -e
          url=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          for i in 1 2 3 4; do
            curl -fL --connect-timeout 20 --max-time 240 "$url" -o /tmp/ffmpeg.tar.xz && break || sleep 6
          done
          mkdir -p /tmp/ffmpeg-static
          tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-static --strip-components=1
          echo "/tmp/ffmpeg-static/bin" >> "$GITHUB_PATH"
      - name: Regenerate all EP01 dialogue VO with the locked ElevenLabs voices
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          set -e
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "::error::repo secret ELEVENLABS_API_KEY is not set — add it in Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi
          python3 scripts/generate_elevenlabs_vo.py
      - name: Apply new VO to section specs (recompute slots, point at committed mp3s)
        run: python3 scripts/ep01_apply_el_vo.py
      - name: Commit VO + updated section specs (triggers the assemble workflow)
        run: |
          git config user.name "voice-bot"
          git config user.email "actions@github.com"
          git add _staging/vo_el _staging/ep01_sec02_urls.json _staging/ep01_sec03_urls.json _staging/ep01_sec05_urls.json
          git commit -m "EP01: regenerate dialogue VO in locked ElevenLabs voices (auto)" || echo "nothing to commit"
          git push
